<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Geospatial Engineering Tools</title>
<meta name="author" content="Ing. Geodesta Mario Forgione L.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#EEF2F6;--panel:#FFFFFF;--ink:#0F2A40;--muted:#55687B;--line:#D3DCE6;--brand:#145487;--brand-ink:#FFFFFF;--accent:#ED6D15;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0B1622;--panel:#112233;--ink:#E3ECF5;--muted:#8FA3B8;--line:#22384F;--brand:#4F8FC7;--brand-ink:#08121C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
main{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px 26px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px}
.code{font:800 44px 'Orbitron','Arial Narrow',Arial,sans-serif;color:var(--accent);letter-spacing:.06em;margin:0}
h1{font:700 16px 'Orbitron','Arial Narrow',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin:0}
p{margin:0;color:var(--muted)}
a.btn{align-self:flex-start;font:600 14px 'IBM Plex Sans',sans-serif;background:var(--brand);color:var(--brand-ink);text-decoration:none;padding:9px 14px;border-radius:5px}
a.btn:hover{background:var(--accent);color:#fff}
.by{font:500 12px 'IBM Plex Mono',monospace;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.by a{color:var(--brand)}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Página no encontrada</h1>
  <p>La aplicación que busca no existe en esta dirección o todavía no se ha publicado.</p>
  <a class="btn" href="/">Ir a Geospatial Engineering Tools</a>
  <div class="by">Elaborado por Ing. Geodesta Mario Forgione L. · <a href="https://www.linkedin.com/in/mario-forgione/" target="_blank" rel="noopener">LinkedIn ↗</a></div>
</main>
</body>
</html>
